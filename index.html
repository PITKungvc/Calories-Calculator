<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- iOS PWA Fullscreen Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kalguroo AI">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2921/2921822.png">
    <link rel="manifest" href="/manifest.json">

    <title>Kalguroo - AI Calorie Tracker (Gemini 3.8 Flash)</title>
    
    <!-- Tailwind CSS & Phosphor Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#fb923c',
                            500: '#f97316',
                            600: '#ea580c',
                            glow: 'rgba(249, 115, 22, 0.35)'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .glow-card {
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        .glow-button {
            box-shadow: 0 8px 24px -4px rgba(249, 115, 22, 0.45);
        }
    </style>
</head>
<body class="bg-[#0b0c10] text-slate-100 min-h-screen pb-32 antialiased selection:bg-brand-500 selection:text-white">

    <div class="max-w-md mx-auto px-5 pt-3 space-y-4">
        
        <!-- Header -->
        <header class="flex justify-between items-center py-2">
            <div>
                <div class="flex items-center gap-1.5">
                    <span class="w-2.5 h-2.5 rounded-full bg-brand-500 animate-pulse"></span>
                    <span id="modelBadge" class="text-[11px] font-bold uppercase tracking-wider text-brand-400">Gemini 3.8 Flash</span>
                </div>
                <h1 class="text-2xl font-black tracking-tight text-white flex items-center gap-2">
                    Kalguroo <span class="text-xs bg-brand-500/20 text-brand-400 border border-brand-500/30 px-2 py-0.5 rounded-full font-semibold">Mobile</span>
                </h1>
            </div>

            <button onclick="toggleSettings()" class="p-2.5 rounded-2xl bg-zinc-900 border border-zinc-800 text-slate-300 hover:text-white active:scale-95 transition">
                <i class="ph-bold ph-gear-six text-lg"></i>
            </button>
        </header>

        <!-- Settings Modal -->
        <div id="settingsBox" class="hidden bg-zinc-900 p-5 rounded-3xl border border-zinc-800 space-y-3.5 shadow-2xl">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-sm text-white">⚙️ ตั้งค่าระบบ</h3>
                <button onclick="toggleSettings()" class="text-slate-400 hover:text-white"><i class="ph-bold ph-x text-base"></i></button>
            </div>
            <div>
                <label class="text-xs text-slate-400 font-medium">Gemini API Key (เชื่อมต่อกับ Cloud แล้ว)</label>
                <input id="apiKeyInput" type="password" placeholder="พร้อมใช้งานอัตโนมัติ (Server Configured)" class="w-full mt-1.5 p-3 bg-zinc-950 rounded-xl border border-zinc-800 text-xs focus:border-brand-500 outline-none text-white">
            </div>
            <div>
                <label class="text-xs text-slate-400 font-medium">AI Model Name</label>
                <input id="modelNameInput" type="text" value="gemini-3.8-flash" class="w-full mt-1.5 p-3 bg-zinc-950 rounded-xl border border-zinc-800 text-xs focus:border-brand-500 outline-none text-brand-400 font-mono">
            </div>
            <div>
                <label class="text-xs text-slate-400 font-medium">เป้าหมายแคลอรี่ประจำวัน (kcal)</label>
                <input id="calorieGoalInput" type="number" value="2000" class="w-full mt-1.5 p-3 bg-zinc-950 rounded-xl border border-zinc-800 text-xs focus:border-brand-500 outline-none text-white">
            </div>
            <button onclick="saveSettings()" class="w-full py-3.5 bg-brand-500 hover:bg-brand-600 rounded-xl font-bold text-xs text-zinc-950 active:scale-95 transition shadow-lg">
                บันทึกการตั้งค่า
            </button>
        </div>

        <!-- HERO: Main Calorie Progress Ring -->
        <div class="relative overflow-hidden bg-gradient-to-b from-zinc-900/90 to-zinc-950/90 border border-zinc-800/80 rounded-[32px] p-6 glow-card">
            <!-- Orange Ambient Light -->
            <div class="absolute -top-16 -right-16 w-44 h-44 bg-brand-500/20 rounded-full blur-3xl pointer-events-none"></div>

            <div class="flex items-center justify-between">
                <div>
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">แคลอรี่วันนี้</span>
                    <div class="flex items-baseline gap-1.5 mt-1">
                        <span id="totalCalDisplay" class="text-4xl font-black text-white tracking-tight">0</span>
                        <span class="text-sm font-semibold text-slate-500">/ <span id="goalDisplay">2000</span> kcal</span>
                    </div>
                    <div id="remainingBadge" class="mt-2.5 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-brand-500/10 border border-brand-500/20 text-brand-400 text-xs font-semibold">
                        <i class="ph-bold ph-fire"></i> เหลืออีก 2,000 kcal
                    </div>
                </div>

                <!-- Circular Progress Ring (SVG) -->
                <div class="relative w-24 h-24 flex items-center justify-center">
                    <svg class="w-full h-full -rotate-90" viewBox="0 0 100 100">
                        <circle cx="50" cy="50" r="40" stroke="currentColor" stroke-width="8" class="text-zinc-800/70" fill="none" />
                        <circle id="progressCircle" cx="50" cy="50" r="40" stroke="url(#orangeGrad)" stroke-width="8" stroke-linecap="round" fill="none"
                            stroke-dasharray="251.2" stroke-dashoffset="251.2" class="transition-all duration-500" />
                        <defs>
                            <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#fdba74" />
                                <stop offset="100%" stop-color="#ea580c" />
                            </linearGradient>
                        </defs>
                    </svg>
                    <div class="absolute text-center">
                        <span id="percentDisplay" class="text-base font-black text-white">0%</span>
                    </div>
                </div>
            </div>

            <!-- Macros Bar -->
            <div class="grid grid-cols-3 gap-3 pt-5 mt-5 border-t border-zinc-800/80 text-xs">
                <div class="space-y-1">
                    <div class="flex justify-between text-[11px]">
                        <span class="text-slate-400">โปรตีน</span>
                        <span id="proteinDisplay" class="font-bold text-white">0g</span>
                    </div>
                    <div class="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden">
                        <div id="pBar" class="bg-brand-500 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between text-[11px]">
                        <span class="text-slate-400">คาร์บ</span>
                        <span id="carbsDisplay" class="font-bold text-amber-400">0g</span>
                    </div>
                    <div class="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden">
                        <div id="cBar" class="bg-amber-400 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
                <div class="space-y-1">
                    <div class="flex justify-between text-[11px]">
                        <span class="text-slate-400">ไขมัน</span>
                        <span id="fatDisplay" class="font-bold text-rose-400">0g</span>
                    </div>
                    <div class="w-full bg-zinc-800 h-1.5 rounded-full overflow-hidden">
                        <div id="fBar" class="bg-rose-400 h-full rounded-full transition-all duration-500" style="width: 0%"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Meal Category Quick View -->
        <div class="grid grid-cols-4 gap-2">
            <div class="bg-zinc-900/60 border border-zinc-800/80 p-2.5 rounded-2xl text-center">
                <span class="text-base">🍳</span>
                <div class="text-[10px] text-slate-400 font-medium mt-0.5">เช้า</div>
                <div id="breakfastCal" class="text-xs font-bold text-white mt-0.5">0</div>
            </div>
            <div class="bg-zinc-900/60 border border-zinc-800/80 p-2.5 rounded-2xl text-center">
                <span class="text-base">🍛</span>
                <div class="text-[10px] text-slate-400 font-medium mt-0.5">กลางวัน</div>
                <div id="lunchCal" class="text-xs font-bold text-white mt-0.5">0</div>
            </div>
            <div class="bg-zinc-900/60 border border-zinc-800/80 p-2.5 rounded-2xl text-center">
                <span class="text-base">🥗</span>
                <div class="text-[10px] text-slate-400 font-medium mt-0.5">เย็น</div>
                <div id="dinnerCal" class="text-xs font-bold text-white mt-0.5">0</div>
            </div>
            <div class="bg-zinc-900/60 border border-zinc-800/80 p-2.5 rounded-2xl text-center">
                <span class="text-base">☕</span>
                <div class="text-[10px] text-slate-400 font-medium mt-0.5">ของว่าง</div>
                <div id="snackCal" class="text-xs font-bold text-white mt-0.5">0</div>
            </div>
        </div>

        <!-- Meals Section -->
        <div class="space-y-3 pt-1">
            <div class="flex justify-between items-center px-1">
                <h3 class="font-extrabold text-sm tracking-wide text-white uppercase flex items-center gap-1.5">
                    <i class="ph-bold ph-fork-knife text-brand-500"></i> ประวัติมื้ออาหารวันนี้
                </h3>
                <span id="itemCountDisplay" class="text-xs text-slate-400 font-medium">0 รายการ</span>
            </div>

            <div id="mealList" class="space-y-2">
                <!-- Meals injected dynamically -->
            </div>
        </div>

    </div>

    <!-- FLOATING CAMERA BUTTON (AI SNAP) -->
    <div class="fixed bottom-6 left-0 right-0 max-w-md mx-auto px-5 pointer-events-none">
        <label class="pointer-events-auto flex items-center justify-center gap-2.5 bg-gradient-to-r from-brand-500 to-brand-600 hover:from-brand-400 hover:to-brand-500 text-zinc-950 font-black py-4 px-6 rounded-3xl glow-button cursor-pointer active:scale-95 transition">
            <i class="ph-bold ph-camera text-xl"></i>
            <span class="tracking-tight text-sm uppercase">สแกนอาหารด้วย AI</span>
            <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handleFoodScan(event)">
        </label>
    </div>

    <!-- Loading Modal -->
    <div id="loadingModal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex flex-col items-center justify-center p-6 space-y-4">
        <div class="w-16 h-16 rounded-full border-4 border-brand-500/20 border-t-brand-500 animate-spin"></div>
        <div class="text-center">
            <div class="font-bold text-base text-white">กำลังวิเคราะห์อาหาร...</div>
            <div class="text-xs text-brand-400 mt-1 font-mono">Powered by Gemini 3.8 Flash</div>
        </div>
    </div>

    <!-- Pre-save Review Modal -->
    <div id="reviewModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-4">
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl w-full max-w-md p-6 space-y-4 shadow-2xl">
            <div class="flex justify-between items-center">
                <span class="text-xs font-bold uppercase tracking-wider text-brand-400 flex items-center gap-1.5">
                    <i class="ph-bold ph-sparkle"></i> ผลการประเมินสารอาหาร
                </span>
                <button onclick="closeReviewModal()" class="text-slate-400 hover:text-white"><i class="ph-bold ph-x text-lg"></i></button>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="text-xs text-slate-400">ชื่ออาหาร (แก้ไขได้)</label>
                    <input id="editName" type="text" class="w-full mt-1 p-3 bg-zinc-950 rounded-xl border border-zinc-800 text-white font-bold text-sm">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-slate-400">มื้ออาหาร</label>
                        <select id="editMealType" class="w-full mt-1 p-3 bg-zinc-950 rounded-xl border border-zinc-800 text-white text-xs font-semibold">
                            <option value="breakfast">🍳 มื้อเช้า</option>
                            <option value="lunch" selected>🍛 มื้อกลางวัน</option>
                            <option value="dinner">🥗 มื้อเย็น</option>
                            <option value="snack">☕ ของว่าง</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400">แคลอรี่ (kcal)</label>
                        <input id="editCal" type="number" class="w-full mt-1 p-3 bg-zinc-950 rounded-xl border border-zinc-800 text-brand-400 font-black text-sm">
                    </div>
                </div>
                <div class="grid grid-cols-3 gap-2 text-xs">
                    <div>
                        <label class="text-slate-400">โปรตีน (g)</label>
                        <input id="editP" type="number" class="w-full mt-1 p-2 bg-zinc-950 rounded-lg border border-zinc-800 text-white text-center font-bold">
                    </div>
                    <div>
                        <label class="text-slate-400">คาร์บ (g)</label>
                        <input id="editC" type="number" class="w-full mt-1 p-2 bg-zinc-950 rounded-lg border border-zinc-800 text-white text-center font-bold">
                    </div>
                    <div>
                        <label class="text-slate-400">ไขมัน (g)</label>
                        <input id="editF" type="number" class="w-full mt-1 p-2 bg-zinc-950 rounded-lg border border-zinc-800 text-white text-center font-bold">
                    </div>
                </div>
            </div>

            <button onclick="confirmSaveMeal()" class="w-full py-4 bg-brand-500 hover:bg-brand-400 text-zinc-950 font-black rounded-2xl active:scale-95 transition shadow-lg text-sm">
                ✅ ยืนยันบันทึกมื้ออาหารนี้
            </button>
        </div>
    </div>

    <script>
        const STORAGE_CONFIG = 'kalguroo_v3_config';
        const STORAGE_MEALS = 'kalguroo_v3_meals';

        let config = { apiKey: '', model: 'gemini-3.8-flash', goal: 2000 };
        let meals = [];

        function initApp() {
            const savedConfig = localStorage.getItem(STORAGE_CONFIG);
            if (savedConfig) config = JSON.parse(savedConfig);

            document.getElementById('apiKeyInput').value = config.apiKey || '';
            document.getElementById('modelNameInput').value = config.model || 'gemini-3.8-flash';
            document.getElementById('calorieGoalInput').value = config.goal || 2000;
            document.getElementById('goalDisplay').innerText = config.goal || 2000;
            document.getElementById('modelBadge').innerText = config.model || 'gemini-3.8-flash';

            const savedMeals = localStorage.getItem(STORAGE_MEALS);
            if (savedMeals) meals = JSON.parse(savedMeals);

            renderDashboard();
        }

        function toggleSettings() {
            document.getElementById('settingsBox').classList.toggle('hidden');
        }

        function saveSettings() {
            config.apiKey = document.getElementById('apiKeyInput').value.trim();
            config.model = document.getElementById('modelNameInput').value.trim() || 'gemini-3.8-flash';
            config.goal = parseInt(document.getElementById('calorieGoalInput').value) || 2000;

            localStorage.setItem(STORAGE_CONFIG, JSON.stringify(config));
            document.getElementById('goalDisplay').innerText = config.goal;
            document.getElementById('modelBadge').innerText = config.model;
            toggleSettings();
            renderDashboard();
            alert('บันทึกการตั้งค่าเรียบร้อยแล้ว');
        }

        function renderDashboard() {
            const today = new Date().toISOString().split('T')[0];
            const todayMeals = meals.filter(m => m.date === today);

            let totalCal = 0, totalP = 0, totalC = 0, totalF = 0;
            let mealBreakdown = { breakfast: 0, lunch: 0, dinner: 0, snack: 0 };

            const listEl = document.getElementById('mealList');
            listEl.innerHTML = '';

            todayMeals.forEach(m => {
                const cal = Number(m.calories) || 0;
                totalCal += cal;
                totalP += Number(m.protein_g) || 0;
                totalC += Number(m.carbs_g) || 0;
                totalF += Number(m.fat_g) || 0;

                if (mealBreakdown[m.meal_type] !== undefined) {
                    mealBreakdown[m.meal_type] += cal;
                }

                const card = document.createElement('div');
                card.className = 'bg-zinc-900/80 border border-zinc-800/80 p-3.5 rounded-2xl flex justify-between items-center';
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-brand-500/10 border border-brand-500/20 flex items-center justify-center text-lg">
                            ${getMealEmoji(m.meal_type)}
                        </div>
                        <div>
                            <div class="font-bold text-sm text-white">${m.name}</div>
                            <div class="text-[11px] text-slate-400">${m.time} • P:${m.protein_g}g C:${m.carbs_g}g F:${m.fat_g}g</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="text-right">
                            <span class="font-extrabold text-sm text-brand-400">${cal}</span>
                            <span class="text-[10px] text-slate-500 block">kcal</span>
                        </div>
                        <button onclick="deleteMeal('${m.id}')" class="p-2 text-slate-500 hover:text-rose-500 active:scale-90 transition">
                            <i class="ph-bold ph-trash text-base"></i>
                        </button>
                    </div>
                `;
                listEl.appendChild(card);
            });

            // Update Calories & Numbers
            document.getElementById('totalCalDisplay').innerText = totalCal.toLocaleString();
            document.getElementById('proteinDisplay').innerText = `${Math.round(totalP)}g`;
            document.getElementById('carbsDisplay').innerText = `${Math.round(totalC)}g`;
            document.getElementById('fatDisplay').innerText = `${Math.round(totalF)}g`;
            document.getElementById('itemCountDisplay').innerText = `${todayMeals.length} รายการ`;

            // Breakdown
            document.getElementById('breakfastCal').innerText = mealBreakdown.breakfast;
            document.getElementById('lunchCal').innerText = mealBreakdown.lunch;
            document.getElementById('dinnerCal').innerText = mealBreakdown.dinner;
            document.getElementById('snackCal').innerText = mealBreakdown.snack;

            // Remaining badge
            const remaining = config.goal - totalCal;
            const remainingBadge = document.getElementById('remainingBadge');
            if (remaining >= 0) {
                remainingBadge.innerHTML = `<i class="ph-bold ph-fire"></i> เหลืออีก ${remaining.toLocaleString()} kcal`;
                remainingBadge.className = "mt-2.5 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-brand-500/10 border border-brand-500/20 text-brand-400 text-xs font-semibold";
            } else {
                remainingBadge.innerHTML = `<i class="ph-bold ph-warning-circle"></i> เกินเป้าหมาย ${Math.abs(remaining).toLocaleString()} kcal`;
                remainingBadge.className = "mt-2.5 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-rose-500/10 border border-rose-500/20 text-rose-400 text-xs font-semibold";
            }

            // Macro bars (Max estimated base: 140g P, 250g C, 70g F)
            document.getElementById('pBar').style.width = `${Math.min((totalP / 140) * 100, 100)}%`;
            document.getElementById('cBar').style.width = `${Math.min((totalC / 250) * 100, 100)}%`;
            document.getElementById('fBar').style.width = `${Math.min((totalF / 70) * 100, 100)}%`;

            // Progress Ring
            const percent = Math.min(Math.round((totalCal / config.goal) * 100), 100);
            document.getElementById('percentDisplay').innerText = `${percent}%`;
            const circumference = 251.2;
            const offset = circumference - (circumference * percent / 100);
            document.getElementById('progressCircle').style.strokeDashoffset = offset;
        }

        function getMealEmoji(type) {
            switch(type) {
                case 'breakfast': return '🍳';
                case 'lunch': return '🍛';
                case 'dinner': return '🥗';
                default: return '☕';
            }
        }

        // AI SCAN FOOD WITH GEMINI 3.8 FLASH
        async function handleFoodScan(event) {
            const file = event.target.files[0];
            if (!file) return;

            // เรียกผ่าน Server API /api/analyze อัตโนมัติ

            const loadingModal = document.getElementById('loadingModal');
            loadingModal.classList.remove('hidden');

            try {
                const { data: base64Data, mimeType } = await compressImage(file, 1600, 0.82);
                const activeModel = config.model || 'gemini-3.8-flash';
                
                const prompt = `คุณคือ AI ผู้เชี่ยวชาญด้านโภชนาการ วิเคราะห์อาหารในภาพนี้อย่างแม่นยำ (เน้นอาหารไทย/เอเชีย)
ระบุชื่ออาหาร, ปริมาณ, ประเภทมื้อที่น่าจะเป็น (breakfast, lunch, dinner, snack), แคลอรี่ และ Macro
ตอบกลับเป็นรูปแบบ JSON เดียวนี้เท่านั้น:
{
  "name": "ชื่ออาหาร",
  "meal_type": "lunch",
  "calories": 550,
  "protein_g": 25.0,
  "carbs_g": 60.0,
  "fat_g": 18.0
}`;

                let result;
                if (config.apiKey) {
                    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${activeModel}:generateContent?key=${config.apiKey}`;
                    const res = await fetch(endpoint, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            contents: [{
                                parts: [
                                    { text: prompt },
                                    { inline_data: { mime_type: mimeType, data: base64Data } }
                                ]
                            }],
                            generationConfig: { response_mime_type: 'application/json' }
                        })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error?.message || 'เชื่อมต่อ Gemini API ล้มเหลว');
                    result = JSON.parse(data.candidates[0].content.parts[0].text);
                } else {
                    const res = await fetch('/api/analyze', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            image: base64Data,
                            mimeType: mimeType,
                            model: activeModel
                        })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.error || 'เชื่อมต่อ Serverless API ล้มเหลว');
                    result = data;
                }

                // Populate into Review Modal
                document.getElementById('editName').value = result.name || 'อาหารจานนี้';
                document.getElementById('editMealType').value = result.meal_type || 'lunch';
                document.getElementById('editCal').value = result.calories || 0;
                document.getElementById('editP').value = result.protein_g || 0;
                document.getElementById('editC').value = result.carbs_g || 0;
                document.getElementById('editF').value = result.fat_g || 0;

                loadingModal.classList.add('hidden');
                document.getElementById('reviewModal').classList.remove('hidden');

            } catch (err) {
                loadingModal.classList.add('hidden');
                alert('เกิดข้อผิดพลาด: ' + err.message);
            } finally {
                event.target.value = '';
            }
        }

        function closeReviewModal() {
            document.getElementById('reviewModal').classList.add('hidden');
        }

        function confirmSaveMeal() {
            const newMeal = {
                id: 'meal_' + Date.now(),
                date: new Date().toISOString().split('T')[0],
                time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }),
                name: document.getElementById('editName').value.trim() || 'อาหาร',
                meal_type: document.getElementById('editMealType').value,
                calories: Number(document.getElementById('editCal').value) || 0,
                protein_g: Number(document.getElementById('editP').value) || 0,
                carbs_g: Number(document.getElementById('editC').value) || 0,
                fat_g: Number(document.getElementById('editF').value) || 0
            };

            meals.unshift(newMeal);
            localStorage.setItem(STORAGE_MEALS, JSON.stringify(meals));
            renderDashboard();
            closeReviewModal();
        }

        function deleteMeal(id) {
            if (!confirm('ต้องการลบมื้อนี้ใช่หรือไม่?')) return;
            meals = meals.filter(m => m.id !== id);
            localStorage.setItem(STORAGE_MEALS, JSON.stringify(meals));
            renderDashboard();
        }

        // บีบอัดและปรับสเกลภาพเป็นขนาด 1600px ด้วย WebP (คมชัดสูง อ่านฉลากตัวหนังสือชัดเจน และไฟล์ไม่เกินโควตา)
        function compressImage(file, maxDimension = 1600, quality = 0.82) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        // ปรับขนาดทั้งแนวตั้งและแนวนอนให้อยู่ในกรอบ 1600px โดยคงอัตราส่วนเดิม
                        if (width > height && width > maxDimension) {
                            height = Math.round((height * maxDimension) / width);
                            width = maxDimension;
                        } else if (height > maxDimension) {
                            width = Math.round((width * maxDimension) / height);
                            height = maxDimension;
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        // ใช้ WebP เพื่อรักษาความคมชัดระดับสูงโดยที่ไฟล์ยังเบามาก (~200-400KB)
                        let mimeType = 'image/webp';
                        let dataUrl = canvas.toDataURL(mimeType, quality);
                        if (!dataUrl.startsWith('data:image/webp')) {
                            mimeType = 'image/jpeg';
                            dataUrl = canvas.toDataURL(mimeType, quality);
                        }

                        resolve({
                            data: dataUrl.split(',')[1],
                            mimeType: mimeType
                        });
                    };
                    img.onerror = () => {
                        resolve({
                            data: e.target.result.split(',')[1],
                            mimeType: file.type || 'image/jpeg'
                        });
                    };
                };
                reader.onerror = reject;
            });
        }

        window.onload = initApp;
    </script>
</body>
